###################################################################
# Local syslog-ng configuration filter definition [parentalcontrol].
###################################################################
filter f_local_parentalcontrol {
    program("parentalcontrold");
};
destination d_local_parentalcontrol {
    file("/var/log/parentalcontrol/parentalcontrol_${YEAR}${MONTH}${DAY}.log" create-dirs(yes));
};
log {
    source(s_all);
    filter(f_local_parentalcontrol);
    destination(d_local_parentalcontrol);
};
