[start]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh start
parameters:
type:script
message:starting parentalcontrold
description:Start parental control

[stop]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh stop
parameters:
type:script
message:stopping parentalcontrold
description:Stop parental control

[restart]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh restart
parameters:
type:script
message:restarting parentalcontrold
description:Restart parental control

[status]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh status
parameters:
type:script_output
message:requesting parentalcontrold status
description:Parental control status

[cleanup]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh cleanup
parameters:
type:script
message:flushing parentalcontrol anchor
description:Flush the parental control firewall anchor

[devices]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/known_devices.py
parameters:
type:script_output
message:listing known devices
description:List known devices

[usage]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/usage.py
parameters:
type:script_output
message:requesting parentalcontrol usage
description:Time used per group

[addtime]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/addtime.py
parameters:%s %s
type:script_output
message:adding extra time to a group
description:Add extra time to a group

[requests]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/list_requests.py
parameters:
type:script_output
message:listing extra time requests
description:List extra time requests

[resolve]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/resolve_request.py
parameters:%s %s
type:script_output
message:resolving an extra time request
description:Approve or reject an extra time request

[testnotify]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/notify_test.py
parameters:
type:script_output
message:sending a test notification
description:Send a test notification

[backendtest]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/backend_test.py
parameters:
type:script_output
message:testing the filter backend connection
description:Test the filter backend connection

[groupcmd]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/group_cmd.py
parameters:%s %s
type:script_output
message:applying a day control to a group
description:Apply a day control to a group

[groupstats]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/ParentalControl/group_stats.py
parameters:%s %s
type:script_output
message:collecting statistics for a group
description:Statistics for a group
