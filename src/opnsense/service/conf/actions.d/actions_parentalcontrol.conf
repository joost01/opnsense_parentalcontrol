[start]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh start
parameters:
type:script
message:starting parentalcontrold
description:Ouderlijk toezicht starten

[stop]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh stop
parameters:
type:script
message:stopping parentalcontrold
description:Ouderlijk toezicht stoppen

[restart]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh restart
parameters:
type:script
message:restarting parentalcontrold
description:Ouderlijk toezicht herstarten

[status]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh status
parameters:
type:script_output
message:requesting parentalcontrold status
description:Status van ouderlijk toezicht

[cleanup]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/service.sh cleanup
parameters:
type:script
message:flushing parentalcontrol anchor
description:Ouderlijk toezicht firewall-anchor leegmaken
